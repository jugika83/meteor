# 매일 저녁 자동으로 현황판을 새로 만들어 사이트에 반영한다.
# 대표님이 아무것도 누르지 않아도 되고, PC가 꺼져 있어도 GitHub 서버에서 돈다.
name: 매일 유성현황 갱신

on:
  schedule:
    - cron: "0 8 * * *"      # UTC 08:00 = 한국시각 17:00 (해 지기 전에 그날 밤 예보 준비)
  workflow_dispatch:          # 저장소 Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 필요한 것 설치
        run: pip install requests

      - name: 현황판 만들기
        run: python 유성현황.py --noopen
        env:
          PYTHONUTF8: "1"

      - name: 바뀐 게 있으면 사이트에 반영
        run: |
          git config user.name "유성현황 자동갱신"
          git config user.email "noreply@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "유성현황 자동 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M'))"
            git push
          fi
